[api]
enabled = true
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 15

[auth]
enabled = true
site_url = "https://envosta-application.vercel.app"
additional_redirect_urls = ["https://envosta-application.vercel.app/auth/callback"]

[auth.email]
enable_signup = true
enable_confirmations = false

# Edge function JWT verification — disabled for functions that handle auth internally.
# This prevents the platform-level JWT check from rejecting valid tokens before
# our function code runs. Auth is enforced in the function code itself.

[functions.log-action]
verify_jwt = false

[functions.stripe-checkout]
verify_jwt = false
